name: Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Build Release Archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package release archive and SHA256SUMS
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PKG_NAME="wsl-agent-sandbox-${TAG}"
          mkdir -p "dist/${PKG_NAME}"
          cp -r box.ps1 wsl-sandbox.ps1 box.json box.schema.json secrets.schema.json LICENSE README.md \
            scripts systemd docker-policy-proxy examples packaging "dist/${PKG_NAME}/"
          (cd dist && zip -r "${PKG_NAME}.zip" "${PKG_NAME}")
          (cd dist && sha256sum "${PKG_NAME}.zip" > SHA256SUMS.txt)

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
