# Optional global WSL2 configuration reference (%USERPROFILE%\.wslconfig)
#
# IMPORTANT: .wslconfig applies to ALL WSL2 distributions on this Windows host.
# wsl-agent-sandbox NEVER modifies your global .wslconfig automatically.
#
# Review carefully before copying any of these settings into %USERPROFILE%\.wslconfig
# (followed by `wsl --shutdown`).

[wsl2]
# NAT networking keeps WSL 127.0.0.1 isolated from Windows localhost ports,
# while localhostForwarding=true still lets Windows browse localhost websites
# hosted inside WSL.
networkingMode=nat
localhostForwarding=true

# Optional resource caps for the shared WSL2 VM:
# memory=8GB
# processors=4
# swap=2GB

# Optional: disable WSLg globally (NOT needed for wsl-agent-sandbox, which
# unmounts /mnt/wslg per-distro without affecting your other WSL distros).
# guiApplications=false
